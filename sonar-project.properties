sonar.projectKey=MealMuster
sonar.projectName=MealMuster
sonar.host.url=http://localhost:9000
sonar.sources=shared,functions/src,web,seed,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=functions/src/shared/**,functions/node_modules/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.git/**,.scannerwork/**,.firebase/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Coverage here comes from Vitest unit tests only. These paths are verified by
# other layers that do not produce lcov: web/** by Playwright (+axe) end-to-end
# tests; firestore-repo.js and index.js by the emulator integration tests and
# Playwright; seed/** by the e2e global setup. They are still analysed for issues.
sonar.coverage.exclusions=**/*.test.js,tests/**,scripts/**,web/**,seed/**,functions/src/index.js,functions/src/firestore-repo.js
sonar.sourceEncoding=UTF-8
sonar.cpd.exclusions=functions/src/shared/**
